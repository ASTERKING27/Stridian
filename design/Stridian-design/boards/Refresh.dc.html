<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stridian pull to refresh</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:#55544F}a:hover{color:#121211}
.t-white{--bg:#F3F2EE;--ink:#121211;--ink2:#55544F;--line:rgba(18,18,17,.14);--glass:rgba(246,245,241,.56);--glassEdge:rgba(18,18,17,.10);--hi:rgba(255,255,255,.8);--shadow:0 14px 34px rgba(18,18,17,.16)}
.t-dark{--bg:#0F0F0E;--ink:#EEEDE8;--ink2:#9D9C96;--line:rgba(238,237,232,.16);--glass:rgba(34,34,32,.5);--glassEdge:rgba(238,237,232,.12);--hi:rgba(255,255,255,.09);--shadow:0 14px 34px rgba(0,0,0,.55)}
.mono{font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace}
.wm{font-family:Archivo,'Helvetica Neue',sans-serif;font-stretch:125%;font-weight:620;letter-spacing:.2em}
.eyebrow{font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace;font-size:10.5px;letter-spacing:.14em;color:var(--ink2)}
.tab{all:unset;box-sizing:border-box;position:absolute;top:3px;height:52px;display:flex;align-items:center;justify-content:center;font:600 12.5px/1 Archivo,'Helvetica Neue',sans-serif;border-radius:26px}
.spk{position:absolute;left:0;top:0;background:currentColor;clip-path:polygon(0 50%,70% 0,100% 50%,70% 100%)}
.lap{animation:lap 1s linear infinite}
@keyframes lap{to{stroke-dashoffset:-100}}
.flashA{animation:einkA 360ms linear}
.flashB{animation:einkB 360ms linear}
@keyframes einkA{0%,45%{filter:invert(1)}46%,100%{filter:none}}
@keyframes einkB{0%,45%{filter:invert(1)}46%,100%{filter:none}}
.ctl{font:500 12px/1 'IBM Plex Mono',ui-monospace,monospace;letter-spacing:.08em;height:44px;padding:0 18px;border:1px solid #121211;background:transparent;color:#121211;border-radius:22px;cursor:pointer}
.ctl:hover{background:rgba(18,18,17,.06)}
.ctl.on{background:#121211;color:#F3F2EE}
</style>
</helmet>
<div style="width: 980px; height: 1060px; box-sizing: border-box; padding: 40px; background: #E6E5E0; font-family: Archivo, 'Helvetica Neue', sans-serif; color: #121211; display: flex; flex-direction: column; gap: 30px">
  <div style="display: flex; gap: 80px">
    <sc-for list="{{phones}}" as="p" hint-placeholder-count="2">
      <div style="display: flex; flex-direction: column; gap: 14px">
        <span class="mono" style="font-size: 11px; letter-spacing: .14em; color: #55544F">{{p.label}}</span>
        <div class="t-{{p.theme}}" style="width: 410px; height: 864px; box-sizing: border-box; padding: 10px; border-radius: 58px; background: #0A0A09; box-shadow: 0 30px 60px rgba(18,18,17,.18)">
          <div onPointerDown="{{p.down}}" onPointerMove="{{p.move}}" onPointerUp="{{p.up}}" onPointerCancel="{{p.up}}" style="position: relative; width: 390px; height: 844px; border-radius: 48px; overflow: hidden; background: var(--bg); color: var(--ink); touch-action: none; user-select: none; cursor: grab">

            <div style="position: absolute; left: 0; right: 0; top: 0; height: {{p.gap}}px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 8px; padding-bottom: 12px; box-sizing: border-box; opacity: {{p.lop}}">
              <svg viewBox="-4 -4 108 108" width="42" height="42" aria-hidden="true" style="transform: scale({{p.ls}}); flex-shrink: 0">
                <path d="{{logoD}}" style="fill: var(--ink); fill-opacity: {{p.fill}}; transition: fill-opacity 160ms linear"></path>
                <path d="{{logoD}}" pathLength="100" fill="none" stroke-width="4.5" stroke-linejoin="miter" stroke-miterlimit="12" class="{{p.lapCls}}" style="stroke: var(--ink); stroke-dasharray: {{p.dash}}"></path>
              </svg>
              <span class="mono" style="font-size: 10px; letter-spacing: .16em; color: var(--ink2); white-space: nowrap">{{p.caption}}</span>
            </div>

            <div class="{{p.flash}}" style="position: absolute; left: 0; right: 0; top: 0; height: 844px; background: var(--bg); transform: translateY({{p.d}}px); box-sizing: border-box; padding: 60px 22px 0; display: flex; flex-direction: column; gap: 22px">
              <div style="display: flex; align-items: center; justify-content: space-between">
                <div style="display: flex; align-items: center; gap: 9px">
                  <svg viewBox="0 0 100 100" width="22" height="22" aria-hidden="true"><path d="{{logoD}}" style="fill: var(--ink)"></path></svg>
                  <span class="wm" style="font-size: 12px">STRIDIAN</span>
                </div>
                <span class="mono" style="font-size: 10.5px; letter-spacing: .1em; color: var(--ink2)">{{p.stamp}}</span>
              </div>
              <div style="display: flex; flex-direction: column; gap: 10px">
                <span class="eyebrow">YOUR SECOND COACH</span>
                <h1 style="margin: 0; font-size: 27px; line-height: 1.16; font-weight: 500; letter-spacing: -.012em; text-wrap: balance">{{p.headline}}</h1>
              </div>
              <div style="border: 1px solid var(--ink); padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px">
                <div style="display: flex; flex-direction: column; gap: 5px">
                  <span class="eyebrow">THIS WEEK'S FOCUS</span>
                  <span style="font-size: 18px; font-weight: 600">30m Sprint</span>
                  <span style="font-size: 12px; color: var(--ink2)">{{p.focus}}</span>
                </div>
                <div style="display: flex; gap: 6px">
                  <span style="width: 16px; height: 16px; background: var(--ink)"></span>
                  <span style="width: 16px; height: 16px; background: var(--ink)"></span>
                  <span style="width: 14px; height: 14px; border: 1px solid var(--ink); background: {{p.third}}"></span>
                </div>
              </div>
              <div style="display: flex; flex-direction: column">
                <span class="eyebrow" style="padding-bottom: 8px">NEXT LEVEL</span>
                <sc-for list="{{p.rows}}" as="r" hint-placeholder-count="4">
                  <div style="display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-top: 1px solid var(--line)">
                    <div style="display: flex; flex-direction: column; gap: 3px"><span style="font-size: 15px">{{r.a}}</span><span class="mono" style="font-size: 11px; color: var(--ink2)">{{r.c}}</span></div>
                    <span class="mono" style="font-size: 15px">{{r.b}}</span>
                  </div>
                </sc-for>
              </div>
            </div>

            <div style="position: absolute; inset: 0; pointer-events: none; color: var(--ink)">
              <sc-for list="{{p.sparks}}" as="s" hint-placeholder-count="0">
                <span class="spk" style="width: {{s.w}}px; height: 2px; opacity: {{s.o}}; transform: translate({{s.x}}px, {{s.y}}px) rotate({{s.r}}deg)"></span>
              </sc-for>
            </div>

            <nav aria-label="Sections" style="position: absolute; left: 10px; right: 10px; bottom: 18px; height: 60px; border-radius: 30px; background: var(--glass); backdrop-filter: blur(18px) saturate(1.3); -webkit-backdrop-filter: blur(18px) saturate(1.3); border: 1px solid var(--glassEdge); box-shadow: var(--shadow), inset 0 1px 0 var(--hi); box-sizing: border-box">
              <span style="position: absolute; top: 3px; height: 52px; border-radius: 26px; background: var(--ink); left: {{ind.l}}px; width: {{ind.w}}px"></span>
              <sc-for list="{{tabs}}" as="t" hint-placeholder-count="4">
                <button class="tab" aria-label="{{t.label}}" aria-current="{{t.current}}" style="left: {{t.l}}px; width: {{t.w}}px; gap: {{t.gap}}px; color: {{t.color}}">
                  <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="butt" stroke-linejoin="miter" aria-hidden="true" style="flex-shrink: 0"><path d="{{t.icon}}"></path></svg>
                  <span style="overflow: hidden; white-space: nowrap; max-width: {{t.lw}}px">{{t.short}}</span>
                </button>
              </sc-for>
            </nav>
          </div>
        </div>
      </div>
    </sc-for>
  </div>
  <div style="display: flex; justify-content: center; align-items: center; gap: 12px">
    <button class="ctl {{autoCls}}" onClick="{{toggleAuto}}" aria-pressed="{{autoOn}}">Auto demo</button>
    <button class="ctl" onClick="{{reset}}">Reset data</button>
    <span class="mono" style="font-size: 11px; letter-spacing: .08em; color: #55544F; padding-left: 8px">Drag down on a screen</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":980,"height":1060}}'>
const LOGO_D = 'M8.0 52.3L58.8 58.1L27.1 83.3L4.7 78.8L4.2 79.2L28.6 94.7L97.0 47.9L27.7 39.6L32.0 24.0L53.0 20.7L68.6 7.6L22.6 12.9ZM81.8 16.0L88.0 25.3L88.7 24.6L88.5 5.3L72.9 7.1L57.6 19.9Z';
const THRESH = 124, HOLD = 124, LOAD = 1500;
const cl = v => v < 0 ? 0 : v > 1 ? 1 : v;
const eIO = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const eOut = t => 1 - Math.pow(1 - t, 3);
const r2 = v => Math.round(v * 100) / 100;
const rubber = raw => 190 * (1 - Math.exp(-raw / 190));

const BEFORE = {
  stamp: 'UPDATED 2 MIN AGO', headline: 'Zonal level, locked in. 3/5 of what matters is already at State.',
  focus: '2 of 3 sessions · 4-week streak', third: 'transparent',
  rows: [{ a: '30m Sprint', b: '4.38 s', c: '0.05 s to State' }, { a: 'Countermovement jump', b: '36 cm', c: '1 cm to State' },
    { a: 'Agility T-test', b: '9.95 s', c: '0.15 s to National' }, { a: 'Yo-Yo IR1', b: '18.9', c: '0.6 to International' }]
};
const AFTER = {
  stamp: 'UPDATED JUST NOW', headline: 'New level unlocked: State in 30m Sprint. 4/5 of what matters is at State.',
  focus: '3 of 3 sessions · 5-week streak', third: 'var(--ink)',
  rows: [{ a: '30m Sprint', b: '4.33 s', c: 'State reached · 0.11 s to National' }, { a: 'Countermovement jump', b: '36 cm', c: '1 cm to State' },
    { a: 'Agility T-test', b: '9.95 s', c: '0.15 s to National' }, { a: 'Yo-Yo IR1', b: '18.9', c: '0.6 to International' }]
};
const SPARKS = Array.from({ length: 12 }, (_, i) => ({ a: (i / 12) * Math.PI * 2 + (i % 2) * .2, dist: 26 + (i % 3) * 9, len: 8 + (i % 4) * 2 }));
const TABS = [
  { label: 'Dashboard', short: 'Dashboard', icon: 'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18Zm0-4a5 5 0 1 0 0-10 5 5 0 0 0 0 10Zm0-4a1 1 0 1 0 0-2 1 1 0 0 0 0 2Z' },
  { label: 'My report', short: 'Report', icon: 'M5 3h10l4 4v14H5V3ZM15 3v4h4M8 11h8M8 15h8M8 19h5' },
  { label: 'Achievements', short: 'Achievements', icon: 'M8 3h8l-2 6h-4L8 3Zm4 6a6 6 0 1 0 0 12 6 6 0 0 0 0-12Z' },
  { label: 'Profile', short: 'Profile', icon: 'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM4.5 20.5c.8-3.6 3.8-6 7.5-6s6.7 2.4 7.5 6' }
];

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tick: 0, auto: true };
    this.raf = null;
    this.last = null;
    const mk = (delay) => ({ d: 0, raw: 0, drag: false, phase: 'idle', armedAt: -1e9, loadAt: 0, fresh: false, flash: '', flip: false,
      idleAt: 0, delay, script: null, startY: 0, scale: 1 });
    this.ph = { white: mk(0), dark: mk(700) };
  }
  componentDidMount() { const n = performance.now(); Object.values(this.ph).forEach(s => { s.idleAt = n; }); this.run(); }
  componentWillUnmount() { if (this.raf) cancelAnimationFrame(this.raf); this.raf = null; }
  run() {
    if (this.raf) return;
    this.last = null;
    const step = ts => {
      const dt = this.last == null ? 16 : Math.min(64, ts - this.last);
      this.last = ts;
      const now = performance.now();
      let busy = false;
      for (const s of Object.values(this.ph)) {
        if (s.script) {
          const u = (now - s.script) / 1100;
          if (u >= 1) { s.script = null; this.release(s, now); }
          else this.pull(s, 270 * eIO(u), now);
        } else if (!s.drag) {
          const target = s.phase === 'loading' ? HOLD : 0;
          s.d += (target - s.d) * (1 - Math.exp(-dt / 85));
          if (s.phase === 'loading' && now - s.loadAt > LOAD) {
            s.phase = 'done'; s.fresh = true; s.flip = !s.flip; s.flash = s.flip ? 'flashA' : 'flashB';
          }
          if ((s.phase === 'done' || s.phase === 'pull') && s.d < .5) { s.phase = 'idle'; s.d = 0; s.idleAt = now; }
          if (this.state.auto && s.phase === 'idle' && now - s.idleAt > 2400 + s.delay) s.script = now;
        }
        if (s.drag || s.script || s.phase !== 'idle' || now - s.armedAt < 600) busy = true;
      }
      this.setState({ tick: this.state.tick + 1 });
      if (busy || this.state.auto) this.raf = requestAnimationFrame(step);
      else this.raf = null;
    };
    this.raf = requestAnimationFrame(step);
  }
  pull(s, raw, now) {
    s.raw = raw;
    const was = s.d >= THRESH;
    s.d = rubber(raw);
    if (s.phase === 'idle') s.phase = 'pull';
    if (!was && s.d >= THRESH) s.armedAt = now;
  }
  release(s, now) {
    s.drag = false;
    if (s.phase === 'pull' && s.d >= THRESH) { s.phase = 'loading'; s.loadAt = now; }
  }
  renderVals() {
    const now = performance.now();
    const inner = 360, active = 0;
    const aw = Math.round(TABS[active].short.length * 7 + 46);
    const iw = (inner - aw) / (TABS.length - 1);
    let x = 4;
    const tabs = TABS.map((tb, i) => {
      const on = i === active, w = on ? aw : iw;
      const o = { ...tb, l: r2(x), w: r2(w), gap: on ? 7 : 0, lw: on ? 110 : 0, color: on ? 'var(--bg)' : 'var(--ink)', current: on ? 'page' : undefined };
      x += w;
      return o;
    });
    const phones = ['white', 'dark'].map(theme => {
      const s = this.ph[theme];
      const prog = cl(s.d / THRESH);
      const armed = s.d >= THRESH;
      let caption = 'PULL TO REFRESH', dash = r2(prog * 100) + ' 100', fill = armed ? 1 : 0, lapCls = '';
      if (s.phase === 'pull' && armed) caption = 'RELEASE TO REFRESH';
      if (s.phase === 'loading') { caption = 'UPDATING'; dash = '22 78'; fill = .12; lapCls = 'lap'; }
      if (s.phase === 'done') { caption = 'UP TO DATE'; dash = '100 0'; fill = 1; }
      const cx = 195, cy = s.d - 53;
      const since = now - s.armedAt;
      const sparks = since >= 0 && since < 520 ? SPARKS.map(k => {
        const u = since / 520, dd = k.dist * eOut(u), w = k.len * (1 - .5 * u);
        const lx = cx + Math.cos(k.a) * (24 + dd), ly = cy + Math.sin(k.a) * (24 + dd);
        return { w: r2(w), o: r2(1 - u), x: r2(lx - w / 2), y: r2(ly - 1), r: r2(k.a * 180 / Math.PI) };
      }) : [];
      const data = s.fresh ? AFTER : BEFORE;
      return {
        theme, label: theme === 'white' ? 'WHITE' : 'DARK',
        d: r2(s.d), gap: r2(Math.max(0, s.d)), lop: r2(cl((s.d - 30) / 50)), ls: r2(.7 + .3 * prog),
        caption, dash, fill, lapCls, sparks, flash: s.flash, ...data,
        down: e => {
          if (s.phase === 'loading' || s.phase === 'done') return;
          this.setState({ auto: false });
          s.script = null; s.drag = true; s.startY = e.clientY;
          const rect = e.currentTarget.getBoundingClientRect();
          s.scale = rect.height / 844 || 1;
          try { e.currentTarget.setPointerCapture(e.pointerId); } catch (err) {}
          this.run();
        },
        move: e => { if (s.drag) this.pull(s, Math.max(0, (e.clientY - s.startY) / s.scale), performance.now()); },
        up: () => { if (s.drag) { this.release(s, performance.now()); this.run(); } }
      };
    });
    return {
      logoD: LOGO_D, phones, tabs, ind: { l: tabs[active].l, w: tabs[active].w },
      autoOn: this.state.auto, autoCls: this.state.auto ? 'on' : '',
      toggleAuto: () => { const n = performance.now(); Object.values(this.ph).forEach(s => { s.idleAt = n - 1800; }); this.setState({ auto: !this.state.auto }, () => this.run()); },
      reset: () => { Object.values(this.ph).forEach(s => { s.fresh = false; s.flash = ''; }); this.setState({ tick: this.state.tick + 1 }); }
    };
  }
}
</script>
</body>
</html>
