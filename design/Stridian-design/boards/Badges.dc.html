<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stridian badges and streak</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:#55544F}a:hover{color:#121211}
.t-white{--bg:#F3F2EE;--ink:#121211;--ink2:#55544F;--line:rgba(18,18,17,.16)}
.t-dark{--bg:#0F0F0E;--ink:#EEEDE8;--ink2:#9D9C96;--line:rgba(238,237,232,.18)}
.mono{font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace}
.eyebrow{font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace;font-size:10.5px;letter-spacing:.14em;color:var(--ink2)}
.spk{position:absolute;left:0;top:0;background:currentColor;clip-path:polygon(0 50%,70% 0,100% 50%,70% 100%)}
.ctl{font:500 12px/1 'IBM Plex Mono',ui-monospace,monospace;letter-spacing:.08em;height:44px;padding:0 18px;border:1px solid #121211;background:transparent;color:#121211;border-radius:22px;cursor:pointer}
.ctl:hover{background:rgba(18,18,17,.06)}
.ctl.on{background:#121211;color:#F3F2EE}
</style>
</helmet>
<div style="width: 1360px; height: 960px; box-sizing: border-box; padding: 40px; background: #E6E5E0; font-family: Archivo, 'Helvetica Neue', sans-serif; color: #121211; display: flex; flex-direction: column; gap: 24px">
  <div style="display: flex; gap: 24px; height: 820px">

    <section class="t-white" style="width: 800px; flex-shrink: 0; background: var(--bg); color: var(--ink); box-sizing: border-box; padding: 30px 32px; display: flex; flex-direction: column; gap: 30px">
      <div style="display: flex; justify-content: space-between; align-items: baseline">
        <div style="display: flex; flex-direction: column; gap: 8px">
          <span class="eyebrow">ACHIEVEMENTS · BADGES</span>
          <span style="font-size: 30px; font-weight: 600; font-stretch: 112%; letter-spacing: -.015em">Badges</span>
        </div>
        <span class="mono" style="font-size: 12px; color: var(--ink2)">{{earnedCount}} / 13 EARNED</span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); column-gap: 12px; row-gap: 30px">
        <sc-for list="{{badges}}" as="b" hint-placeholder-count="13">
          <div style="display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center">
            <div style="position: relative; width: 86px; height: 96px; color: var(--ink)">
              <svg viewBox="0 0 72 80" width="86" height="96" aria-hidden="true" style="overflow: visible">
                <defs><clipPath id="{{b.cid}}"><polygon points="{{b.poly}}"></polygon></clipPath></defs>
                <path d="M19 0H72V64L53 80H0V16Z" fill="none" stroke-width="1.3" stroke-linejoin="miter" style="stroke: var(--line)"></path>
                <path d="M19 0H72V64L53 80H0V16Z" pathLength="100" fill="none" stroke-width="1.6" stroke-linejoin="miter" style="stroke: var(--ink); stroke-dasharray: {{b.dash}}"></path>
                <path d="M19 0H72V64L53 80H0V16Z" clip-path="url(#{{b.cid}})" style="fill: var(--ink)"></path>
                <g transform="{{b.gT}}"><path d="{{b.icon}}" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="stroke: {{b.gc}}"></path></g>
              </svg>
              <sc-for list="{{b.sparks}}" as="s" hint-placeholder-count="0">
                <span class="spk" style="width: {{s.w}}px; height: 2px; opacity: {{s.o}}; transform: translate({{s.x}}px, {{s.y}}px) rotate({{s.r}}deg)"></span>
              </sc-for>
              <sc-if value="{{b.isNew}}" hint-placeholder-val="{{false}}">
                <span class="mono" style="position: absolute; right: -8px; top: -8px; padding: 3px 6px; background: var(--bg); border: 1px solid var(--ink); font-size: 9px; letter-spacing: .12em; opacity: {{b.newO}}">NEW</span>
              </sc-if>
            </div>
            <div style="display: flex; flex-direction: column; gap: 4px">
              <span style="font-size: 14px; font-weight: 600; color: {{b.tc}}">{{b.title}}</span>
              <span style="font-size: 11.5px; line-height: 1.35; color: var(--ink2)">{{b.desc}}</span>
              <sc-if value="{{b.prog}}" hint-placeholder-val="{{false}}">
                <span class="mono" style="font-size: 10px; letter-spacing: .1em; color: var(--ink)">{{b.prog}}</span>
              </sc-if>
            </div>
          </div>
        </sc-for>
      </div>
    </section>

    <section class="t-dark" style="flex-grow: 1; background: var(--bg); color: var(--ink); box-sizing: border-box; padding: 30px 32px; display: flex; flex-direction: column; gap: 28px">
      <div style="display: flex; justify-content: space-between; align-items: baseline">
        <span class="eyebrow">FOCUS STREAK</span>
        <span class="mono" style="font-size: 11px; letter-spacing: .1em; color: var(--ink2)">30M SPRINT</span>
      </div>

      <div style="position: relative; display: flex; align-items: flex-end; gap: 16px">
        <div style="height: 120px; overflow: hidden">
          <div style="display: flex; flex-direction: column; transform: translateY({{st.numY}}px)">
            <span style="font-size: 120px; line-height: 120px; font-weight: 700; font-stretch: 125%">3</span>
            <span style="font-size: 120px; line-height: 120px; font-weight: 700; font-stretch: 125%">4</span>
          </div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px; padding-bottom: 16px">
          <span style="font-size: 18px; font-weight: 600; font-stretch: 112%">weeks in a row</span>
          <span class="mono" style="font-size: 11px; color: var(--ink2)">{{st.best}}</span>
        </div>
        <sc-for list="{{st.sparks}}" as="s" hint-placeholder-count="0">
          <span class="spk" style="width: {{s.w}}px; height: 2px; opacity: {{s.o}}; transform: translate({{s.x}}px, {{s.y}}px) rotate({{s.r}}deg)"></span>
        </sc-for>
      </div>

      <div style="display: flex; flex-direction: column; gap: 10px">
        <span class="eyebrow">LAST 8 WEEKS</span>
        <div style="display: flex; gap: 8px">
          <sc-for list="{{st.weeks}}" as="w" hint-placeholder-count="8">
            <div style="flex: 1; display: flex; flex-direction: column; gap: 8px; align-items: center">
              <div style="position: relative; width: 100%; height: 64px; clip-path: polygon(38% 0, 100% 0, 62% 100%, 0 100%); background: var(--line)">
                <div style="position: absolute; inset: 0; background: var(--ink); transform: translateY({{w.fy}}%)"></div>
              </div>
              <span class="mono" style="font-size: 9.5px; letter-spacing: .06em; color: {{w.lc}}">{{w.label}}</span>
            </div>
          </sc-for>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 10px">
        <span class="eyebrow">THIS WEEK · 3 SESSIONS</span>
        <div style="display: flex; gap: 10px">
          <sc-for list="{{st.sessions}}" as="se" hint-placeholder-count="3">
            <div style="flex: 1; height: 52px; box-sizing: border-box; border: 1px solid var(--ink); position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden">
              <div style="position: absolute; inset: 0; background: var(--ink); transform: scale({{se.s}})"></div>
              <span class="mono" style="position: relative; font-size: 11px; letter-spacing: .12em; color: {{se.c}}">{{se.day}}</span>
            </div>
          </sc-for>
        </div>
      </div>

      <div style="margin-top: auto; display: flex; align-items: center; gap: 22px; padding-top: 22px; border-top: 1px solid var(--line); opacity: {{st.badgeO}}">
        <div style="position: relative; width: 86px; height: 96px; flex-shrink: 0; color: var(--ink)">
          <svg viewBox="0 0 72 80" width="86" height="96" aria-hidden="true" style="overflow: visible">
            <defs><clipPath id="cp-streak"><polygon points="{{sb.poly}}"></polygon></clipPath></defs>
            <path d="M19 0H72V64L53 80H0V16Z" fill="none" stroke-width="1.3" stroke-linejoin="miter" style="stroke: var(--line)"></path>
            <path d="M19 0H72V64L53 80H0V16Z" pathLength="100" fill="none" stroke-width="1.6" stroke-linejoin="miter" style="stroke: var(--ink); stroke-dasharray: {{sb.dash}}"></path>
            <path d="M19 0H72V64L53 80H0V16Z" clip-path="url(#cp-streak)" style="fill: var(--ink)"></path>
            <g transform="{{sb.gT}}"><path d="{{sb.icon}}" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="stroke: {{sb.gc}}"></path></g>
          </svg>
          <sc-for list="{{sb.sparks}}" as="s" hint-placeholder-count="0">
            <span class="spk" style="width: {{s.w}}px; height: 2px; opacity: {{s.o}}; transform: translate({{s.x}}px, {{s.y}}px) rotate({{s.r}}deg)"></span>
          </sc-for>
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px">
          <span class="eyebrow">BADGE UNLOCKED</span>
          <span style="font-size: 24px; font-weight: 600; font-stretch: 112%">Machine</span>
          <span style="font-size: 13px; color: var(--ink2)">Four weeks of focus in a row.</span>
        </div>
      </div>
    </section>
  </div>
  <div style="display: flex; justify-content: center; align-items: center; gap: 10px">
    <button class="ctl" onClick="{{replay}}">Replay</button>
    <span style="width: 1px; height: 24px; background: rgba(18,18,17,.2)"></span>
    <sc-for list="{{speeds}}" as="sp" hint-placeholder-count="3">
      <button class="ctl {{sp.cls}}" onClick="{{sp.pick}}" aria-pressed="{{sp.on}}">{{sp.label}}</button>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1360,"height":960}}'>
const I = {
  clipboard: 'M9 4h6M9 4a2 2 0 0 0-2 2H6a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-1a2 2 0 0 0-2-2M8 12h8M8 16h5',
  shield: 'M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6l-8-3Z',
  student: 'M12 3 2 8l10 5 10-5-10-5ZM5 11v5c0 1.7 3.1 3 7 3s7-1.3 7-3v-5',
  card: 'M5 3h10l4 4v14H5V3ZM15 3v4h4M8 11h8M8 15h8M8 19h5',
  whistle: 'M3 10h10a5 5 0 1 1-5 5V10M13 10l7-3',
  l1: 'M6 20V14M12 20V9M18 20V4',
  l2: 'M4 20h16M7 20v-6h3v6M14 20V9h3v11',
  l3: 'M12 3l2.5 5 5.5.8-4 3.9.9 5.5-4.9-2.6-4.9 2.6.9-5.5-4-3.9L9.5 8 12 3Z',
  trend: 'M3 17 9 11l4 4 8-8M15 7h6v6',
  target: 'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18Zm0-4a5 5 0 1 0 0-10 5 5 0 0 0 0 10Zm0-4a1 1 0 1 0 0-2 1 1 0 0 0 0 2Z',
  flame: 'M12 3c1 3.5 5 5.5 5 10a5 5 0 0 1-10 0c0-2 1-3.5 2-4.5 0 2 1 3 2 3 0-3-1-5.5 1-8.5Z',
  bolt: 'M13 2 4 14h7l-1 8 9-12h-7l1-8Z',
  medal: 'M8 3h8l-2 6h-4L8 3Zm4 6a6 6 0 1 0 0 12 6 6 0 0 0 0-12Zm0 3 1.2 2.4 2.6.4-1.9 1.8.5 2.6-2.4-1.3-2.4 1.3.5-2.6-1.9-1.8 2.6-.4L12 12Z'
};
// backend/coach.py BADGES — id, icon, title, what earns it
const BADGES = [
  ['first_test', 'clipboard', 'First rep', 'Your first test result is in.'],
  ['verified', 'shield', 'Squad official', 'Your coach confirmed your position.'],
  ['profile', 'student', 'All set', 'Every part of your profile filled in.'],
  ['receipts', 'card', 'Receipts', 'A certificate verified by your coach.'],
  ['match_day', 'whistle', 'Match day', 'Played on a finished match card.'],
  ['state', 'l1', 'State-ready', 'A result at State level or better.'],
  ['national', 'l2', 'National contender', 'A result at National level or better.'],
  ['international', 'l3', 'World-class moment', 'A result at International level.'],
  ['on_the_up', 'trend', 'On the up', 'Three measures better than the time before.'],
  ['focus', 'target', 'Focus finished', 'Did every session of a weekly focus.'],
  ['streak_2', 'flame', 'Locked in', 'Two weeks of focus in a row.'],
  ['streak_4', 'bolt', 'Machine', 'Four weeks of focus in a row.'],
  ['streak_8', 'medal', 'Unstoppable', 'Eight weeks of focus in a row.']
];
const START = ['first_test', 'verified', 'profile', 'receipts', 'state', 'focus', 'streak_2'];
const QUEUE = ['streak_4', 'on_the_up', 'match_day', 'national', 'international', 'streak_8'];
const EVERY = 2600;
const PHI = 50 * Math.PI / 180;
const NX = Math.cos(PHI), NY = Math.sin(PHI), UX = -Math.sin(PHI), UY = Math.cos(PHI);
const BMAX = 72 * NX + 80 * NY;
const cl = v => v < 0 ? 0 : v > 1 ? 1 : v;
const lerp = (a, b, t) => a + (b - a) * t;
const eIO = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const eOut = t => 1 - Math.pow(1 - t, 3);
const eBack = t => { const c = 1.7; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
const r2 = v => Math.round(v * 100) / 100;
const FULL = '0,0 72,0 72,80 0,80', NONE = '0,0 0,0 0,0';

function sweepPoly(lead) {
  const T = 200;
  return [[lead, -T], [lead, T], [lead - T, T], [lead - T, -T]].map(([c, t]) => r2(NX * c + UX * t) + ',' + r2(NY * c + UY * t)).join(' ');
}
function burst(u, cx, cy, n, dist, seed) {
  if (u < 0 || u > 1) return [];
  const out = [];
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2 + seed + (i % 2) * .2;
    const dd = (dist + (i % 3) * 8) * eOut(u), w = (8 + (i % 4) * 3) * (1 - .5 * u);
    out.push({ w: r2(w), o: r2(1 - u), x: r2(cx + Math.cos(a) * dd - w / 2), y: r2(cy + Math.sin(a) * dd - 1), r: r2(a * 180 / Math.PI) });
  }
  return out;
}
const gT = s => 'translate(36 40) scale(' + r2(s * 1.35) + ') translate(-12 -12)';
// one badge earning: outline draws, ink sweeps in on the tab-sweep angle, glyph flips and pops, sparks
function earn(u) {
  if (u == null) return null;
  const dash = r2(eOut(cl(u / 420)) * 100) + ' 100';
  const lead = lerp(-10, BMAX + 10, eIO(cl((u - 300) / 450)));
  const flipped = u >= 600;
  const s = !flipped ? 1 : lerp(.6, 1, eBack(cl((u - 600) / 320)));
  return { dash, poly: u < 300 ? NONE : sweepPoly(lead), gT: gT(s), gc: flipped ? 'var(--bg)' : 'var(--ink2)',
    sparks: burst((u - 700) / 560, 43, 48, 10, 44, 0), filled: u >= 750 };
}
const earnedLook = { dash: '100 0', poly: FULL, gT: gT(1), gc: 'var(--bg)', sparks: [] };
const lockedLook = (p) => ({ dash: r2(p * 100) + ' 100', poly: NONE, gT: gT(1), gc: 'var(--ink2)', sparks: [] });

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tick: 0, speed: 1 };
    this.vt = 0; this.last = null; this.raf = null;
    this.gridT0 = 800; this.stT0 = 600;
  }
  componentDidMount() { this.run(); }
  componentWillUnmount() { if (this.raf) cancelAnimationFrame(this.raf); this.raf = null; }
  run() {
    if (this.raf) return;
    const step = ts => {
      const dt = this.last == null ? 16 : Math.min(64, ts - this.last);
      this.last = ts;
      this.vt += dt * this.state.speed;
      if (this.vt - this.gridT0 > EVERY * (QUEUE.length + 1.2)) this.gridT0 = this.vt + 400;
      if (this.vt - this.stT0 > 7000) this.stT0 = this.vt + 300;
      this.setState({ tick: this.state.tick + 1 });
      this.raf = requestAnimationFrame(step);
    };
    this.raf = requestAnimationFrame(step);
  }
  renderVals() {
    // badge grid: one locked badge earns every EVERY ms
    const g = this.vt - this.gridT0;
    const k = g < 0 ? -1 : Math.floor(g / EVERY);
    let earnedCount = START.length;
    const badges = BADGES.map(([id, icon, title, desc], i) => {
      const q = QUEUE.indexOf(id);
      let look, isNew = false, newO = 0, earned = START.includes(id);
      if (q >= 0 && q < k) { look = earnedLook; earned = true; }
      else if (q >= 0 && q === k) {
        const u = g - q * EVERY;
        const e = earn(u);
        look = e; earned = e.filled;
        isNew = u > 800; newO = r2(cl((u - 800) / 200));
      } else if (!earned) look = lockedLook(id === 'streak_8' ? (k >= 0 ? .5 : .375) : 0);
      else look = earnedLook;
      if (earned && !START.includes(id)) earnedCount++;
      const prog = !earned && id === 'streak_8' ? (k >= 0 ? '4 / 8 WEEKS' : '3 / 8 WEEKS') : '';
      return { cid: 'cp-' + id, icon: I[icon], title, desc, isNew, newO, prog, tc: earned ? 'var(--ink)' : 'var(--ink2)', ...look };
    });

    // streak: third session ticks, the week's stride bar fills, the count rolls 3 → 4, Machine unlocks
    const t = this.vt - this.stT0;
    const tick3 = eOut(cl((t - 700) / 240));
    const weekFill = eIO(cl((t - 1000) / 520));
    const roll = eIO(cl((t - 1500) / 560));
    const labels = ['W35', 'W36', 'W37', 'W38', 'W39', 'W40', 'W41', 'W42'];
    const done = [false, true, true, false, true, true, true];
    const weeks = labels.map((label, i) => {
      const f = i < 7 ? (done[i] ? 1 : 0) : weekFill;
      return { label, fy: r2(100 * (1 - f)), lc: i === 7 ? 'var(--ink)' : 'var(--ink2)' };
    });
    const sessions = ['MON', 'WED', 'FRI'].map((day, i) => {
      const s = i < 2 ? 1 : tick3;
      return { day, s: r2(s), c: s > .5 ? 'var(--bg)' : 'var(--ink)' };
    });
    const bu = t - 2300;
    const sbLook = bu < 0 ? lockedLook(0) : earn(bu);
    const st = { best: roll > .5 ? 'NEW BEST · 4 WEEKS' : 'BEST · 3 WEEKS', numY: r2(-120 * roll), weeks, sessions, badgeO: r2(bu < -300 ? .35 : lerp(.35, 1, cl((bu + 300) / 300))),
      sparks: burst((t - 2000) / 560, 60, 60, 12, 70, .3) };
    const sb = { icon: I.bolt, ...sbLook };

    const speeds = [1, .5, .25].map(v => ({ label: v === 1 ? '1×' : v === .5 ? '½×' : '¼×', on: this.state.speed === v,
      cls: this.state.speed === v ? 'on' : '', pick: () => this.setState({ speed: v }) }));
    return { badges, earnedCount, st, sb, speeds,
      replay: () => { this.gridT0 = this.vt + 300; this.stT0 = this.vt + 300; } };
  }
}
</script>
</body>
</html>
