<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stridian logo</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:#55544F}a:hover{color:#121211}
.mono{font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace}
.wm{font-family:Archivo,'Helvetica Neue',sans-serif;font-stretch:125%;font-weight:620;letter-spacing:.2em}
</style>
</helmet>
<div style="width: 1360px; height: 900px; box-sizing: border-box; padding: 40px; background: #E6E5E0; color: #121211; font-family: Archivo, 'Helvetica Neue', sans-serif; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: 500px minmax(0, 1fr); gap: 24px">

  <section style="position: relative; background: #F3F2EE; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 30px">
    <span class="mono" style="position: absolute; left: 24px; top: 22px; font-size: 11px; letter-spacing: .14em; color: #55544F">WHITE</span>
    <svg viewBox="0 0 100 100" width="228" height="228" aria-hidden="true"><path d="{{body}}" fill="#121211"></path></svg>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 10px">
      <span class="wm" style="font-size: 30px; padding-left: .2em">STRIDIAN</span>
      <span class="mono" style="font-size: 11px; letter-spacing: .16em; color: #55544F">SPORTS TALENT INTELLIGENCE</span>
    </div>
    <span class="mono" style="position: absolute; left: 24px; bottom: 20px; font-size: 11px; letter-spacing: .06em; color: #55544F">#F3F2EE · #121211</span>
  </section>

  <section style="position: relative; background: #0F0F0E; color: #EEEDE8; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 30px">
    <span class="mono" style="position: absolute; left: 24px; top: 22px; font-size: 11px; letter-spacing: .14em; color: #9D9C96">DARK</span>
    <svg viewBox="0 0 100 100" width="228" height="228" aria-hidden="true"><path d="{{body}}" fill="#EEEDE8"></path></svg>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 10px">
      <span class="wm" style="font-size: 30px; padding-left: .2em">STRIDIAN</span>
      <span class="mono" style="font-size: 11px; letter-spacing: .16em; color: #9D9C96">SPORTS TALENT INTELLIGENCE</span>
    </div>
    <span class="mono" style="position: absolute; left: 24px; bottom: 20px; font-size: 11px; letter-spacing: .06em; color: #9D9C96">#0F0F0E · #EEEDE8</span>
  </section>

  <div style="grid-column: 1 / -1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px">

    <section style="position: relative; background: #F3F2EE; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 14px; box-sizing: border-box">
      <span class="mono" style="position: absolute; left: 24px; top: 22px; font-size: 11px; letter-spacing: .14em; color: #55544F">CONSTRUCTION</span>
      <svg viewBox="-45 -8 190 114" width="380" height="228" aria-hidden="true">
        <path d="{{body}}" fill="#121211" fill-opacity="0.08" stroke="#121211" stroke-width="0.4" stroke-linejoin="miter" stroke-miterlimit="12"></path>
        
        <polyline points="88.8,26.4 83.9,10.7 27.1,18.6 18.3,46.0 77.0,52.8 28.5,88.7 3.0,78.5" fill="none" stroke="#121211" stroke-width="0.45" stroke-dasharray="1.6 1.2"></polyline>
        <sc-for list="{{joints}}" as="j" hint-placeholder-count="8">
          <rect x="{{j.rx}}" y="{{j.ry}}" width="2.6" height="2.6" fill="#121211" transform="{{j.rot}}"></rect>
        </sc-for>
        <text x="93" y="8" text-anchor="start" fill="#55544F" style="font: 500 4.1px 'IBM Plex Mono', monospace; letter-spacing: .12em">ELBOW</text>
        <text x="93" y="28" text-anchor="start" fill="#55544F" style="font: 500 4.1px 'IBM Plex Mono', monospace; letter-spacing: .12em">HAND</text>
        <text x="18" y="12" text-anchor="end" fill="#55544F" style="font: 500 4.1px 'IBM Plex Mono', monospace; letter-spacing: .12em">ELBOW</text>
        <text x="4" y="54" text-anchor="end" fill="#55544F" style="font: 500 4.1px 'IBM Plex Mono', monospace; letter-spacing: .12em">HIP</text>
        <text x="101" y="49" text-anchor="start" fill="#55544F" style="font: 500 4.1px 'IBM Plex Mono', monospace; letter-spacing: .12em">KNEE</text>
        <text x="33" y="100" text-anchor="start" fill="#55544F" style="font: 500 4.1px 'IBM Plex Mono', monospace; letter-spacing: .12em">HEEL</text>
        <text x="1" y="77" text-anchor="end" fill="#55544F" style="font: 500 4.1px 'IBM Plex Mono', monospace; letter-spacing: .12em">TOE</text>
      </svg>
    </section>

    <section style="position: relative; background: #D6D5CF; display: flex; align-items: center; justify-content: center; gap: 44px; padding-top: 18px">
      <span class="mono" style="position: absolute; left: 24px; top: 22px; font-size: 11px; letter-spacing: .14em; color: #4A4944">APP ICON</span>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 14px">
        <div style="width: 120px; height: 120px; border-radius: 27px; background: #F3F2EE; box-shadow: 0 1px 0 rgba(18,18,17,.06), 0 10px 26px rgba(18,18,17,.12); display: flex; align-items: center; justify-content: center">
          <svg viewBox="0 0 100 100" width="70" height="70" aria-hidden="true"><path d="{{body}}" fill="#121211"></path></svg>
        </div>
        <span class="mono" style="font-size: 11px; letter-spacing: .14em; color: #4A4944">WHITE</span>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 14px">
        <div style="width: 120px; height: 120px; border-radius: 27px; background: #0F0F0E; box-shadow: 0 1px 0 rgba(18,18,17,.1), 0 10px 26px rgba(18,18,17,.22); display: flex; align-items: center; justify-content: center">
          <svg viewBox="0 0 100 100" width="70" height="70" aria-hidden="true"><path d="{{body}}" fill="#EEEDE8"></path></svg>
        </div>
        <span class="mono" style="font-size: 11px; letter-spacing: .14em; color: #4A4944">DARK</span>
      </div>
    </section>

    <section style="position: relative; background: #F3F2EE; display: flex; flex-direction: column; justify-content: flex-end; gap: 12px; padding: 56px 24px 24px; box-sizing: border-box">
      <span class="mono" style="position: absolute; left: 24px; top: 22px; font-size: 11px; letter-spacing: .14em; color: #55544F">LOCKUP</span>
      <div style="height: 92px; border: 1px solid rgba(18,18,17,.14); display: flex; align-items: center; justify-content: center; gap: 16px">
        <svg viewBox="0 0 100 100" width="38" height="38" aria-hidden="true"><path d="{{body}}" fill="#121211"></path></svg>
        <span class="wm" style="font-size: 21px">STRIDIAN</span>
      </div>
      <div style="height: 92px; background: #0F0F0E; color: #EEEDE8; display: flex; align-items: center; justify-content: center; gap: 16px">
        <svg viewBox="0 0 100 100" width="38" height="38" aria-hidden="true"><path d="{{body}}" fill="#EEEDE8"></path></svg>
        <span class="wm" style="font-size: 21px">STRIDIAN</span>
      </div>
    </section>

  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1360,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const joints = [[88.8,26.4],[83.9,10.7],[27.1,18.6],[18.3,46.0],[77.0,52.8],[28.5,88.7],[3.0,78.5]]
      .map(([x, y]) => ({ rx: x - 1.3, ry: y - 1.3, rot: 'rotate(45 ' + x + ' ' + y + ')' }));
    return {
      body: 'M8.0 52.3L58.8 58.1L27.1 83.3L4.7 78.8L4.2 79.2L28.6 94.7L97.0 47.9L27.7 39.6L32.0 24.0L53.0 20.7L68.6 7.6L22.6 12.9ZM81.8 16.0L88.0 25.3L88.7 24.6L88.5 5.3L72.9 7.1L57.6 19.9Z',
      joints
    };
  }
}
</script>
</body>
</html>
