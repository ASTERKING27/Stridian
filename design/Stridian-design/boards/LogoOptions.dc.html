<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stridian logo options</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:#55544F}a:hover{color:#121211}
.mono{font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace}
</style>
</helmet>
<div style="width: 1360px; height: 900px; box-sizing: border-box; padding: 40px; background: #E6E5E0; color: #121211; font-family: Archivo, 'Helvetica Neue', sans-serif; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px">
  <sc-for list="{{options}}" as="o" hint-placeholder-count="3">
    <div style="display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; align-items: baseline; justify-content: space-between">
        <span style="font-size: 20px; font-weight: 600; font-stretch: 112%">{{o.name}}</span>
        <span class="mono" style="font-size: 11px; letter-spacing: .14em; color: #55544F">{{o.tag}}</span>
      </div>
      <div style="flex-grow: 1; background: #F3F2EE; display: flex; align-items: center; justify-content: center">
        <svg viewBox="0 0 100 100" width="250" height="250" aria-hidden="true"><path d="{{o.d}}" fill="#121211"></path></svg>
      </div>
      <div style="height: 250px; background: #0F0F0E; display: flex; align-items: center; justify-content: center; gap: 44px">
        <svg viewBox="0 0 100 100" width="130" height="130" aria-hidden="true"><path d="{{o.d}}" fill="#EEEDE8"></path></svg>
        <div style="width: 84px; height: 84px; border-radius: 19px; background: #F3F2EE; display: flex; align-items: center; justify-content: center">
          <svg viewBox="0 0 100 100" width="50" height="50" aria-hidden="true"><path d="{{o.d}}" fill="#121211"></path></svg>
        </div>
      </div>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1360,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      options: [
        { name: 'Arm cut', tag: 'A', d: 'M3.0 55.3L56.7 61.4L30.7 82.3L15.9 80.2L14.4 81.4L32.5 94.3L97.0 50.7L23.8 41.9L28.3 25.5L50.4 22.0L66.9 8.1L18.4 13.7ZM80.8 17.1L86.3 25.3L88.0 23.8L87.8 5.7L71.3 7.6L55.1 21.2Z' },
        { name: 'Knee forward', tag: 'B', d: 'M3.0 55.2L56.9 59.0L29.7 78.8L7.5 76.0L6.5 76.9L31.4 89.1L97.0 48.3L21.7 42.6L25.5 28.4L45.1 25.3L59.6 13.1L16.8 18.0ZM72.0 21.0L76.7 28.0L78.5 26.5L78.3 10.9L64.0 12.6L49.7 24.6Z' },
        { name: 'Extended legs', tag: 'C · CURRENT', d: 'M8.0 52.3L58.8 58.1L27.1 83.3L4.7 78.8L4.2 79.2L28.6 94.7L97.0 47.9L27.7 39.6L32.0 24.0L53.0 20.7L68.6 7.6L22.6 12.9ZM81.8 16.0L88.0 25.3L88.7 24.6L88.5 5.3L72.9 7.1L57.6 19.9Z' }
      ]
    };
  }
}
</script>
</body>
</html>
