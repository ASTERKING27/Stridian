<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stridian glass tab bar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:#55544F}a:hover{color:#121211}
.t-white{--bg:#F3F2EE;--ink:#121211;--ink2:#55544F;--line:rgba(18,18,17,.14);--glass:rgba(246,245,241,.56);--glassEdge:rgba(18,18,17,.10);--hi:rgba(255,255,255,.8);--shadow:0 14px 34px rgba(18,18,17,.16)}
.t-dark{--bg:#0F0F0E;--ink:#EEEDE8;--ink2:#9D9C96;--line:rgba(238,237,232,.16);--glass:rgba(34,34,32,.5);--glassEdge:rgba(238,237,232,.12);--hi:rgba(255,255,255,.09);--shadow:0 14px 34px rgba(0,0,0,.55)}
.mono{font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace}
.eyebrow{font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace;font-size:10.5px;letter-spacing:.14em;color:var(--ink2)}
.tab{all:unset;box-sizing:border-box;position:absolute;top:3px;height:52px;display:flex;align-items:center;justify-content:center;font:600 12.5px/1 Archivo,'Helvetica Neue',sans-serif;cursor:pointer;border-radius:26px}
.tab:focus-visible{outline:2px solid var(--ink);outline-offset:-4px}
.tab:active svg{transform:scale(.88)}
.tab svg{transition:transform 160ms ease}
.ctl{font:500 12px/1 'IBM Plex Mono',ui-monospace,monospace;letter-spacing:.06em;height:44px;padding:0 18px;border:1px solid #121211;background:transparent;color:#121211;border-radius:22px;cursor:pointer}
.ctl:hover{background:rgba(18,18,17,.06)}
.ctl.on{background:#121211;color:#F3F2EE}
</style>
</helmet>
<div style="width: 1010px; height: 700px; box-sizing: border-box; padding: 34px 40px 40px; background: #E6E5E0; font-family: Archivo, 'Helvetica Neue', sans-serif; color: #121211; display: grid; grid-template-columns: 90px 390px 390px; grid-template-rows: 44px repeat(3, 176px); column-gap: 24px; row-gap: 18px; align-items: center">
  <button class="ctl {{autoCls}}" onClick="{{toggleAuto}}" aria-pressed="{{autoOn}}" style="grid-column: 1; justify-self: start; padding: 0 14px">Auto</button>
  <span class="mono" style="font-size: 11px; letter-spacing: .14em; color: #55544F">WHITE</span>
  <span class="mono" style="font-size: 11px; letter-spacing: .14em; color: #55544F">DARK</span>

  <sc-for list="{{rows}}" as="row" hint-placeholder-count="3">
    <div style="display: flex; flex-direction: column; gap: 6px; align-self: center">
      <span style="font-size: 16px; font-weight: 600">{{row.label}}</span>
      <span class="mono" style="font-size: 11px; color: #55544F">{{row.count}}</span>
    </div>
    <sc-for list="{{row.bars}}" as="bar" hint-placeholder-count="2">
      <div class="t-{{bar.theme}}" style="position: relative; width: 390px; height: 176px; border-radius: 22px 22px 48px 48px; overflow: hidden; background: var(--bg); color: var(--ink); isolation: isolate">
        <div style="position: absolute; left: 22px; right: 22px; top: 16px; display: flex; flex-direction: column">
          <span class="eyebrow" style="padding-bottom: 6px">NEXT LEVEL</span>
          <div style="display: flex; justify-content: space-between; align-items: center; padding: 11px 0; border-top: 1px solid var(--line)"><span style="font-size: 15px">30m Sprint</span><span class="mono" style="font-size: 15px">4.38 s</span></div>
          <div style="display: flex; justify-content: space-between; align-items: center; padding: 11px 0; border-top: 1px solid var(--line)"><span style="font-size: 15px">Countermovement jump</span><span class="mono" style="font-size: 15px">36 cm</span></div>
          <div style="display: flex; justify-content: space-between; align-items: center; padding: 11px 0; border-top: 1px solid var(--line)"><span style="font-size: 15px">Agility T-test</span><span class="mono" style="font-size: 15px">9.95 s</span></div>
          <div class="mono" style="height: 36px; margin-top: 2px; padding: 0 14px; display: flex; align-items: center; background: var(--ink); color: var(--bg); font-size: 11px; letter-spacing: .12em">THIS WEEK'S FOCUS · 30M SPRINT</div>
        </div>
        <nav aria-label="{{row.label}} sections" style="position: absolute; left: 10px; right: 10px; bottom: 18px; height: 60px; border-radius: 30px; background: var(--glass); backdrop-filter: blur(18px) saturate(1.3); -webkit-backdrop-filter: blur(18px) saturate(1.3); border: 1px solid var(--glassEdge); box-shadow: var(--shadow), inset 0 1px 0 var(--hi); box-sizing: border-box">
          <span style="position: absolute; top: 3px; height: 52px; border-radius: 26px; background: var(--ink); left: {{bar.ind.l}}px; right: {{bar.ind.r}}px; transition: {{bar.ind.tr}}"></span>
          <sc-for list="{{bar.tabs}}" as="t" hint-placeholder-count="4">
            <button class="tab" onClick="{{t.go}}" aria-label="{{t.label}}" aria-current="{{t.current}}" style="left: {{t.l}}px; width: {{t.w}}px; gap: {{t.gap}}px; color: {{t.color}}; transition: {{t.tr}}">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="butt" stroke-linejoin="miter" aria-hidden="true" style="flex-shrink: 0"><path d="{{t.icon}}"></path></svg>
              <span style="overflow: hidden; white-space: nowrap; max-width: {{t.lw}}px; opacity: {{t.lo}}; transition: {{t.ltr}}">{{t.short}}</span>
            </button>
          </sc-for>
        </nav>
      </div>
    </sc-for>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1010,"height":700}}'>
const PW = 368, INNER = 360;
const r2 = v => Math.round(v * 100) / 100;
const I = {
  target: 'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18Zm0-4a5 5 0 1 0 0-10 5 5 0 0 0 0 10Zm0-4a1 1 0 1 0 0-2 1 1 0 0 0 0 2Z',
  card: 'M5 3h10l4 4v14H5V3ZM15 3v4h4M8 11h8M8 15h8M8 19h5',
  medal: 'M8 3h8l-2 6h-4L8 3Zm4 6a6 6 0 1 0 0 12 6 6 0 0 0 0-12Z',
  person: 'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM4.5 20.5c.8-3.6 3.8-6 7.5-6s6.7 2.4 7.5 6',
  clipboard: 'M9 4h6M9 4a2 2 0 0 0-2 2H6a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-1a2 2 0 0 0-2-2M8 12h8M8 16h5',
  film: 'M3 6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6ZM3 10h18M3 15h18M8 4v16M16 4v16',
  chart: 'M4 20V10M10 20V4M16 20v-7M22 20H2',
  sliders: 'M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M14 4v4M8 10v4M16 16v4',
  cpu: 'M9 3v3M15 3v3M9 18v3M15 18v3M3 9h3M3 15h3M18 9h3M18 15h3M7 6h10a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1ZM10 10h4v4h-4Z',
  plus: 'M12 5v14M5 12h14'
};
const COACH = [
  { label: 'Coach Entry', short: 'Entry', icon: I.clipboard }, { label: 'Match Footage', short: 'Footage', icon: I.film },
  { label: 'Match Cards', short: 'Cards', icon: I.card }, { label: 'Dashboard', short: 'Squad', icon: I.chart },
  { label: 'Weights', short: 'Weights', icon: I.sliders }, { label: 'AI Training', short: 'AI', icon: I.cpu }
];
const ROLES = [
  { key: 'student', label: 'Student', tabs: [
    { label: 'Dashboard', short: 'Dashboard', icon: I.target }, { label: 'My report', short: 'Report', icon: I.card },
    { label: 'Achievements', short: 'Achievements', icon: I.medal }, { label: 'Profile', short: 'Profile', icon: I.person }] },
  { key: 'coach', label: 'Coach', tabs: COACH },
  { key: 'admin', label: 'Admin', tabs: [{ label: 'Add Student', short: 'Add', icon: I.plus }].concat(COACH) }
];

class Component extends DCLogic {
  constructor(props) {
    super(props);
    const act = {}, dir = {};
    ROLES.forEach(r => ['white', 'dark'].forEach(th => { act[r.key + th] = 0; dir[r.key + th] = 1; }));
    this.state = { act, dir, auto: true };
    this.timer = null;
  }
  componentDidMount() { this.timer = setInterval(() => this.cycle(), 1700); }
  componentWillUnmount() { clearInterval(this.timer); }
  cycle() {
    if (!this.state.auto) return;
    const act = { ...this.state.act }, dir = { ...this.state.dir };
    ROLES.forEach(r => ['white', 'dark'].forEach(th => {
      const k = r.key + th, n = r.tabs.length;
      const next = (act[k] + 1) % n;
      dir[k] = next > act[k] ? 1 : -1;
      act[k] = next;
    }));
    this.setState({ act, dir });
  }
  pick(k, i) {
    const cur = this.state.act[k];
    if (i === cur) return;
    this.setState({ auto: false, act: { ...this.state.act, [k]: i }, dir: { ...this.state.dir, [k]: i > cur ? 1 : -1 } });
  }
  renderVals() {
    const ease = 'cubic-bezier(.5,0,.2,1)', fast = 'cubic-bezier(.2,.8,.2,1)', slow = 'cubic-bezier(.6,0,.2,1)';
    const rows = ROLES.map(r => ({
      label: r.label, count: r.tabs.length + ' tabs',
      bars: ['white', 'dark'].map(theme => {
        const k = r.key + theme, a = this.state.act[k], d = this.state.dir[k], n = r.tabs.length;
        const aw = Math.round(r.tabs[a].short.length * 7 + 46);
        const iw = (INNER - aw) / (n - 1);
        let x = 4;
        const tabs = r.tabs.map((tb, i) => {
          const on = i === a, w = on ? aw : iw;
          const o = { ...tb, l: r2(x), w: r2(w), gap: on ? 7 : 0, lw: on ? 110 : 0, lo: on ? 1 : 0,
            color: on ? 'var(--bg)' : 'var(--ink)', current: on ? 'page' : undefined,
            tr: 'left 440ms ' + ease + ', width 440ms ' + ease + ', color 220ms linear ' + (on ? '120ms' : '0ms'),
            ltr: 'max-width 440ms ' + ease + ', opacity ' + (on ? '260ms linear 160ms' : '120ms linear 0ms'),
            go: () => this.pick(k, i) };
          x += w;
          return o;
        });
        const act = tabs[a];
        const lead = d >= 0 ? 'right' : 'left', tail = d >= 0 ? 'left' : 'right';
        return { theme, tabs, ind: { l: act.l, r: r2(PW - act.l - act.w), tr: lead + ' 320ms ' + fast + ', ' + tail + ' 500ms ' + slow + ' 40ms' } };
      })
    }));
    return { rows, autoOn: this.state.auto, autoCls: this.state.auto ? 'on' : '',
      toggleAuto: () => this.setState({ auto: !this.state.auto }) };
  }
}
</script>
</body>
</html>
